version: 2

# Builds, archives, and GitHub releases are wired (docs/roadmap.md §5.5, T40). CGO_ENABLED=0
# holds from the first commit (T1). M3.5.5 (T33, T40, tdd.md §13) closes the remaining gaps T9
# named: generated completions/man pages are packaged into the archives, and sboms, signs, and
# kos all ship.
#
# The release checksum and the ko-built container image are both signed with keyless cosign —
# two separate GoReleaser sections, signs: and docker_signs:, because a kos-built manifest lands
# in the same artifact list dockers:-built images do (T42).
#
# Deferred — each needs a separate repository the author must create and maintain, not a missing
# fact (docs/roadmap.md §5.5, T33, T40):
#   aur                — Arch User Repository publishing (needs an AUR package repo)
#   homebrew_casks     — macOS distribution (needs a tap repo)
#
# Deferred, unscoped (T9):
#   nfpms              — .deb/.rpm/.apk packaging

builds:
  - id: hasp
    main: ./cmd/hasp
    binary: hasp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/boweeb/hasp/internal/cli.version={{.Version}}
      - -X github.com/boweeb/hasp/internal/cli.commit={{.Commit}}
      - -X github.com/boweeb/hasp/internal/cli.date={{.Date}}

archives:
  - id: hasp
    formats: [tar.gz]
    # Explicit files: replaces GoReleaser's default list entirely (license*/readme*/changelog*),
    # so those defaults are restated here alongside the generated reference surface (T34) this
    # milestone packages in for the first time (T33).
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - completions/*
      - manpages/*

sboms:
  - artifacts: archive

# Keyless: signed against Sigstore's Fulcio using the GitHub Actions OIDC token the release
# workflow mints (permissions: id-token: write); no private key. --bundle combines the
# certificate and signature into one file (tdd.md §13).
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum

# The container image (tdd.md §13): no Dockerfile, FROM-scratch-capable because of the
# CGO_ENABLED=0 build above. build: hasp imports that build's ldflags, so version/commit/date
# land in the image's hasp binary exactly as they do in the archives.
kos:
  - id: hasp
    build: hasp
    main: ./cmd/hasp
    # Deliberately floating, unlike T32's dev-tool pins: a distroless base should pick up its
    # maintainer's continuous security patches on every release, not freeze them. `:nonroot`
    # preserves Chainguard's prior nonroot-by-default behavior — plain
    # gcr.io/distroless/static:latest runs as root without it (T46).
    base_image: gcr.io/distroless/static:nonroot
    repositories:
      - ghcr.io/boweeb/hasp
    # ko's default naming appends the import-path base name plus an MD5 hash of the full import
    # path (collision avoidance for repos that build multiple binaries) — e.g. the real M3.5.5
    # release published as ghcr.io/boweeb/hasp/hasp-d5fbbc4f5b1acdd77c3cef4c7e734ce8 instead of
    # ghcr.io/boweeb/hasp. hasp only ever builds one image, so bare: true publishes straight to
    # the repositories: value with no extra path segment.
    bare: true
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{.Version}}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    creation_time: "{{.CommitTimestamp}}"

# The ko-built image manifest lands in the same artifact list dockers:-built images do, so
# GoReleaser signs it here rather than in signs: above — same keyless OIDC/Fulcio/Rekor flow, no
# private key (T42).
docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - sign
      - ${artifact}
      - --yes
    output: true

release:
  github:
    owner: boweeb
    name: hasp

changelog:
  # No `sort:` — GoReleaser's sort is alphabetical by commit subject, not
  # chronological. Unset keeps `git log` order (newest first).
  use: git
