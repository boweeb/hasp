version: 2

# Builds and archives are wired, and releases publish to GitHub (docs/roadmap.md §5.5, T40).
# CGO_ENABLED=0 holds from the first commit (T1).
#
# M3.5 scope, not yet configured here (docs/roadmap.md §5.5, T9, T40):
#   completions/man    — generated by cobra, not yet packaged into the archives
#   sboms              — supply-chain attestation
#   signs              — cosign keyless signing via GitHub Actions' OIDC issuer
#   ko                 — container image, published to ghcr.io
#
# Deferred — each needs a separate repository the author must create and maintain, not a missing
# fact (docs/roadmap.md §5.5, T33, T40):
#   aur                — Arch User Repository publishing (needs an AUR package repo)
#   homebrew_casks     — macOS distribution (needs a tap repo)
#
# Deferred, unscoped (T9):
#   nfpms              — .deb/.rpm/.apk packaging

builds:
  - id: hasp
    main: ./cmd/hasp
    binary: hasp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/boweeb/hasp/internal/cli.version={{.Version}}
      - -X github.com/boweeb/hasp/internal/cli.commit={{.Commit}}
      - -X github.com/boweeb/hasp/internal/cli.date={{.Date}}

release:
  github:
    owner: boweeb
    name: hasp

changelog:
  # No `sort:` — GoReleaser's sort is alphabetical by commit subject, not
  # chronological. Unset keeps `git log` order (newest first).
  use: git

archives:
  - id: hasp
    formats: [tar.gz]
